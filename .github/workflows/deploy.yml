name: Desplegar a Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  # Els guardians del contracte (G1 contracte-full, G2 render-pur, G3 golden) + la resta de
  # la suite. Un commit que els trenque NO arriba a prod (desplegar depén d'este job).
  provar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Provar (suite + guardians del full)
        run: npm test

  desplegar:
    needs: provar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar
        uses: cloudflare/wrangler-action@v3
        with:
          # El token es guarda com a secret del repo, mai al codi.
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d6fe40b41d43108a129b5a62a864e706
          command: pages deploy public --project-name tonico --branch main
