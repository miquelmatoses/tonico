<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/estil.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Tonico</title>
</head>
<body>
  <main>
  <div class="auth">
    <aside class="auth-pitch">
      <div class="auth-marca"><img class="hdr-logo" src="/logo-mark.svg" alt="" aria-hidden="true"><span class="hdr-nom">TONICO</span></div>
      <div>
        <span class="kicker" data-i18n="auth.kicker"></span>
        <h1><span data-i18n="auth.hero1"></span><br><em data-i18n="auth.hero2"></em></h1>
        <p class="auth-sub" data-i18n="auth.sub"></p>
      </div>
      <dl class="auth-stats">
        <div><dt data-i18n="auth.stat1"></dt><dd data-i18n="auth.stat1_v"></dd></div>
        <div><dt data-i18n="auth.stat2"></dt><dd data-i18n="auth.stat2_v"></dd></div>
        <div><dt data-i18n="auth.stat3"></dt><dd data-i18n="auth.stat3_v"></dd></div>
      </dl>
    </aside>
    <div class="auth-form"><div class="auth-caixa">
<section>
      <h2 data-i18n="registre.titol"></h2>
      <form id="registre">
        <p><label><span data-i18n="comu.idioma"></span><br>
          <span id="tria-idioma"></span></label></p>
        <p><label><span data-i18n="registre.correu"></span><br>
          <input type="email" name="correu" autocomplete="username" required></label></p>
        <p><label><span data-i18n="registre.contrasenya"></span><br>
          <input type="password" name="contrasenya" autocomplete="new-password" required></label></p>
        <p><button type="submit" data-i18n="registre.enviar"></button></p>
        <p role="alert" id="error" hidden></p>
        <p role="status" id="pendent" hidden></p>
      </form>
      <p><a href="/" data-i18n="registre.cap_login"></a></p>
    </section>
    </div></div>
  </div>
  </main>
  <script type="module">
    import { carregaI18n, aplicaI18n, t, selectorIdioma, idiomaActual } from '/comu.js';
    await carregaI18n();
    aplicaI18n();
    const sel = selectorIdioma();                 // canvi → recarrega en l'idioma triat
    sel.name = 'idioma';
    document.getElementById('tria-idioma').append(sel);
    const form = document.getElementById('registre');
    const err = document.getElementById('error');
    const pendent = document.getElementById('pendent');
    const errKey = { correu_ja_registrat: 'registre.error_duplicat', correu_invalid: 'registre.error_correu' };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const cos = Object.fromEntries(new FormData(form));
      const r = await fetch('/api/registre', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify(cos),
      });
      const dades = await r.json().catch(() => ({}));
      if (r.ok && dades.verificacio_pendent) {
        form.hidden = true; pendent.textContent = t('registre.pendent'); pendent.hidden = false; return;
      }
      if (r.ok) { location.href = '/app.html'; return; }
      err.textContent = t(errKey[dades.error] || 'registre.error');
      err.hidden = false;
    });
  </script>
</body>
</html>
