<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/estil.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Tonico</title>
</head>
<body>
  <main>
  <div class="auth">
    <aside class="auth-pitch">
      <div class="auth-marca"><div class="hdr-logo">T</div><span class="hdr-nom">TONICO</span></div>
      <div>
        <span class="kicker" data-i18n="auth.kicker"></span>
        <h1><span data-i18n="auth.hero1"></span><br><em data-i18n="auth.hero2"></em></h1>
        <p class="auth-sub" data-i18n="auth.sub"></p>
      </div>
      <dl class="auth-stats">
        <div><dt data-i18n="auth.stat1"></dt><dd data-i18n="auth.stat1_v"></dd></div>
        <div><dt data-i18n="auth.stat2"></dt><dd data-i18n="auth.stat2_v"></dd></div>
        <div><dt data-i18n="auth.stat3"></dt><dd data-i18n="auth.stat3_v"></dd></div>
      </dl>
    </aside>
    <div class="auth-form"><div class="auth-caixa">
<section>
      <h2 data-i18n="login.titol"></h2>
      <form id="entrar">
        <p><label><span data-i18n="login.correu"></span><br>
          <input type="email" name="correu" autocomplete="username" required></label></p>
        <p><label><span data-i18n="login.contrasenya"></span><br>
          <input type="password" name="contrasenya" autocomplete="current-password" required></label></p>
        <p><button type="submit" data-i18n="login.entrar"></button></p>
        <p role="alert" id="error" hidden></p>
      </form>
      <p><a href="/registre.html" data-i18n="login.cap_registre"></a></p>
    </section>
    </div></div>
  </div>
  </main>
  <script type="module">
    import { carregaI18n, aplicaI18n, t } from '/comu.js';
    await carregaI18n();
    aplicaI18n();
    const form = document.getElementById('entrar');
    const err = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const cos = Object.fromEntries(new FormData(form));
      const r = await fetch('/api/entrar', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify(cos),
      });
      if (r.ok) {
        const d = await r.json().catch(() => ({}));
        if (d.idioma) try { localStorage.setItem('idioma', d.idioma); } catch { /* sense emmagatzematge */ }
        location.href = '/app.html'; return;
      }
      err.textContent = t('login.error');
      err.hidden = false;
    });
  </script>
</body>
</html>
